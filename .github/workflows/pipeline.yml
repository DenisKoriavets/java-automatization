name: Java CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-analyze-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    defaults:
      run:
        working-directory: ./homework-5

    steps:
      - name: Завантаження коду з репозиторію
        uses: actions/checkout@v4

      - name: Налаштування Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Надання прав на виконання Gradle
        run: chmod +x ./gradlew

      - name: Статичний аналіз коду (Checkstyle)
        run: ./gradlew checkstyleMain

      - name: Автоматизоване тестування
        run: ./gradlew test

      - name: Збирання проєкту в JAR
        run: ./gradlew assemble

      - name: Збереження JAR як артефакту
        uses: actions/upload-artifact@v4
        with:
          name: homework-5-artifact
          path: homework-5/build/libs/*.jar

      - name: Публікація в GitHub Packages
        run: ./gradlew publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}